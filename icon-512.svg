<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f2c" />
      <stop offset="50%" stop-color="#141b4d" />
      <stop offset="100%" stop-color="#2a0845" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Chronometer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="14 10" filter="url(#neonGlow)" />

  <!-- Central Glass Hexagon / Matrix Shield -->
  <polygon points="256,120 370,185 370,325 256,390 142,325 142,185" fill="#101633" stroke="url(#glowGrad)" stroke-width="10" />

  <!-- Matrix Grid Checkmarks Inside -->
  <g fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Sparkle -->
    <path d="M256,160 L256,200 M236,180 L276,180" />
    <!-- Center Checkmark -->
    <path d="M200,260 L240,300 L320,210" stroke="#10b981" stroke-width="14" filter="url(#neonGlow)" />
  </g>

  <!-- Mascot Eyes Symbol / Cyber Head -->
  <circle cx="210" cy="200" r="10" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="302" cy="200" r="10" fill="#38bdf8" filter="url(#neonGlow)" />
  <path d="M236,230 Q256,245 276,230" fill="none" stroke="#c084fc" stroke-width="5" stroke-linecap="round" />

  <!-- Outer Orbiting Core -->
  <circle cx="256" cy="76" r="18" fill="#f59e0b" filter="url(#neonGlow)" />
  <circle cx="436" cy="256" r="14" fill="#0284c7" filter="url(#neonGlow)" />
  <circle cx="256" cy="436" r="16" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="76" cy="256" r="14" fill="#e11d48" filter="url(#neonGlow)" />
</svg>
